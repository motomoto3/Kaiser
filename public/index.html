<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SpaceX IPO Market Cap — Polymarket Live</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/public/style.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <div>
        <div class="kicker">Live · Polymarket CLOB</div>
        <h1>SpaceX IPO Market Cap</h1>
      </div>
      <div class="header-controls">
        <span class="stale-warning" id="staleWarning" hidden>Data stale</span>
        <span class="last-update" id="lastUpdate">—</span>
        <button id="refreshBtn">Refresh now</button>
      </div>
    </div>
  </header>

  <nav id="tab-nav">
    <div class="tab-nav-inner">
      <button class="tab-btn active" data-tab="dashboard">Dashboard</button>
      <button class="tab-btn" data-tab="calculator">Calculator</button>
      <button class="tab-btn" data-tab="explore">Exploration</button>
    </div>
  </nav>

  <div id="tab-dashboard" class="tab-panel">
    <div id="events-panel-mount"></div>
    <main id="main">
      <div class="loading" id="loading">Fetching market data…</div>
    </main>
  </div>

  <div id="tab-calculator" class="tab-panel" hidden>
    <div id="calc-root"></div>
  </div>

  <div id="tab-explore" class="tab-panel" hidden>
    <div id="explore-root"></div>
  </div>

  <script src="/public/app.js" defer></script>
</body>
</html>
