<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SpaceX IPO Market Cap — Polymarket Live</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/public/style.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <div>
        <div class="kicker">Live · Polymarket CLOB</div>
        <h1>SpaceX IPO Market Cap</h1>
      </div>
      <div class="header-controls">
        <span class="stale-warning" id="staleWarning" hidden>Data stale</span>
        <span class="last-update" id="lastUpdate">—</span>
        <button id="refreshBtn">Refresh now</button>
      </div>
    </div>
  </header>

  <main id="main">
    <div class="loading" id="loading">Fetching market data…</div>
  </main>

  <div id="calc-root"></div>

  <script src="/public/app.js" defer></script>
</body>
</html>
